map $http_x_forwarded_proto $robyn_prod_proto {
    default $scheme;
    https https;
    http http;
}
map $http_upgrade $robyn_prod_connection {
    default upgrade;
    "" close;
}
limit_req_zone $binary_remote_addr zone=robyn_prod_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=robyn_prod_api:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=robyn_prod_conn:10m;
server {
    listen 127.0.0.1:3082;
    listen 192.168.50.108:3082;
    server_name www.sherwoodforest.trade;
    return 308 https://sherwoodforest.trade$request_uri;
}
server {
    listen 127.0.0.1:3082 default_server;
    listen 192.168.50.108:3082 default_server;
    server_name sherwoodforest.trade _;
    server_tokens off;
    client_max_body_size 2m;
    limit_conn robyn_prod_conn 40;
    limit_req zone=robyn_prod_web burst=60 nodelay;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    location = /internal/health {
        allow 127.0.0.1;
        allow 192.168.50.0/24;
        deny all;
        proxy_pass http://127.0.0.1:3121/status;
    }
    location ~ ^/(admin|metrics|debug)(/|$) {
        deny all;
        return 404;
    }
    location = /rpc {
        limit_req zone=robyn_prod_api burst=30 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18549/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $robyn_prod_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location /api/ {
        limit_req zone=robyn_prod_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3121/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $robyn_prod_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location ~ "^/ipfs/(b[a-z2-7]{20,120})$" {
        limit_req zone=robyn_prod_api burst=30 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080/ipfs/$1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 127.0.0.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:3022;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $robyn_prod_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $robyn_prod_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
