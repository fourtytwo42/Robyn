          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/robinhood-rpc-node.md
      - alert: RobinhoodMainnetMemoryFloorLow
        expr: node_memory_MemAvailable_bytes{job="robinhood-rpc-host"} < 2147483648
        for: 5m
        labels:
          severity: critical
          chain_id: "4663"
          component: robinhood-rpc-memory
          runbook: robinhood-rpc-node
        annotations:
          summary: Robinhood Mainnet host has less than 2 GiB available memory
