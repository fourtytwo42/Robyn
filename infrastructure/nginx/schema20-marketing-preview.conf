worker_processes 1;
pid /tmp/robyn-schema20-marketing-preview-nginx.pid;
error_log /tmp/robyn-schema20-marketing-preview-nginx-error.log warn;

events { worker_connections 256; }

http {
  access_log /tmp/robyn-schema20-marketing-preview-nginx-access.log;
  server {
    listen 192.168.50.250:33000;
    server_name _;
    client_max_body_size 2m;

    location /api/ {
      proxy_pass http://127.0.0.1:33101/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rpc {
      proxy_pass http://127.0.0.1:28547/;
      proxy_set_header Host $host;
    }

    location /rpc/ {
      proxy_pass http://127.0.0.1:28547/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://127.0.0.1:33002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
