[extend]
useDefault = true

[[allowlists]]
description = "Public EVM addresses in deployment and research evidence"
regexTarget = "match"
regexes = ['''0x[0-9a-fA-F]{40}''']

[[allowlists]]
description = "User story prose misclassified as an API credential"
regexTarget = "match"
regexes = ['''token address, market/liquidity''']
