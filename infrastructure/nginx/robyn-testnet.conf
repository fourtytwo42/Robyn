map $http_x_forwarded_proto $robyn_testnet_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 127.0.0.1:3081;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;
    limit_conn robyn_conn 40;
    limit_req zone=robyn_web burst=60 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=robyn_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3111/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $robyn_testnet_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ "^/ipfs/(b[a-z2-7]{20,120})$" {
        limit_req zone=robyn_api burst=30 nodelay;
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8080/ipfs/$1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 127.0.0.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $robyn_testnet_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
