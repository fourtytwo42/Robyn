<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sherwood Forest</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #ecfdf5;
        background: radial-gradient(
          circle at 50% 0%,
          #174a35 0,
          #07150f 48%,
          #030806 100%
        );
      }
      main {
        width: min(560px, 100%);
        padding: 48px 32px;
        border: 1px solid rgba(110, 231, 183, 0.24);
        border-radius: 28px;
        background: rgba(4, 18, 12, 0.76);
        text-align: center;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 18px;
        color: #062016;
        background: #6ee7b7;
        font-size: 34px;
        font-weight: 900;
        transform: rotate(-4deg);
      }
      p {
        margin: 0 0 10px;
        color: #9bc9b6;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(34px, 8vw, 60px);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      small {
        display: block;
        margin-top: 22px;
        color: #76a58f;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <p>Sherwood Forest</p>
      <h1>Mainnet is coming.</h1>
      <small
        >The production forest is not open yet. Testnet validation is continuing
        separately.</small
      >
    </main>
  </body>
</html>
