global:
  resolve_timeout: 30s
route:
  receiver: robyn-local-evidence
  group_by: [alertname, chain_id, component, launch, asset]
  group_wait: 1s
  group_interval: 2s
  repeat_interval: 1h
receivers:
  - name: robyn-local-evidence
    webhook_configs:
      - url: http://127.0.0.1:9094/alerts
        send_resolved: true
inhibit_rules: []
