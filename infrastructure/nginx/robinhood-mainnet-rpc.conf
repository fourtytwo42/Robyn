limit_req_zone $binary_remote_addr zone=robinhood_mainnet_rpc:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=robinhood_mainnet_rpc_conn:10m;
server {
    listen 192.168.50.117:8547;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/robinhood-mainnet-rpc.access.log;
    error_log /var/log/nginx/robinhood-mainnet-rpc.error.log warn;
    location / {
        allow 192.168.50.250;
        allow 192.168.50.117;
        deny all;
        limit_except POST { deny all; }
        limit_req zone=robinhood_mainnet_rpc burst=250 nodelay;
        limit_conn robinhood_mainnet_rpc_conn 64;
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:18547;
    }
}
server {
    listen 192.168.50.117:16071;
    server_name _;
    server_tokens off;
    access_log off;
    location = /metrics {
        allow 192.168.50.250;
        allow 192.168.50.117;
        deny all;
        limit_except GET { deny all; }
        proxy_set_header Host localhost;
        proxy_pass http://127.0.0.1:16070/debug/metrics/prometheus;
    }
    location / { return 404; }
}
