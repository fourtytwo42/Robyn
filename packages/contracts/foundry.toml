[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
  "forge-std/=../../node_modules/@uniswap/v4-core/lib/forge-std/src/",
  "@uniswap/v4-core/=../../node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=../../node_modules/@uniswap/v4-periphery/",
  "permit2/=../../node_modules/@uniswap/v4-periphery/lib/permit2/",
  "solmate/=../../node_modules/@uniswap/v4-periphery/lib/permit2/lib/solmate/",
]
allow_paths = ["../../node_modules"]
fs_permissions = [{ access = "read", path = "../../node_modules" }, { access = "read", path = "test/fixtures" }]
gas_limit = 30_000_000_000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.assurance.invariant]
runs = 256
depth = 128
fail_on_revert = true
