limit_req_zone $binary_remote_addr zone=robyn_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=robyn_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=robyn_rpc:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=robyn_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream robyn_web_backend {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream robyn_api_backend {
    server 127.0.0.1:3101;
    keepalive 16;
}

upstream robyn_rpc_backend {
    server 127.0.0.1:8547;
    keepalive 32;
}

server {
    listen 3000 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;
    limit_conn robyn_conn 40;
    limit_req zone=robyn_web burst=60 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=robyn_api burst=60 nodelay;
        proxy_pass http://robyn_api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://robyn_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 3100;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;
    limit_conn robyn_conn 30;
    limit_req zone=robyn_api burst=60 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://robyn_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}

server {
    listen 8546;
    server_name _;
    server_tokens off;
    client_max_body_size 256k;
    limit_conn robyn_conn 40;
    limit_req zone=robyn_rpc burst=100 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://robyn_rpc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
