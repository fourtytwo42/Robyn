[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
remappings = ["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../../node_modules"]
gas_limit = 30_000_000_000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.assurance.invariant]
runs = 256
depth = 128
fail_on_revert = true
