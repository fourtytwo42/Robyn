groups:
  - name: robyn-release-readiness
    interval: 15s
    rules:
      - alert: RobynComponentDown
        expr: robyn_component_up == 0 or robyn_pm2_process_up == 0 or robyn_systemd_unit_up == 0 or robyn_assurance_drill{alert="RobynComponentDown"} == 1
        for: 1m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            launch: all,
            asset: all,
            runbook: component-down,
          }
        annotations:
          summary: "Robyn component {{ $labels.component }} is down"
          description: 'Chain 31337 component {{ $labels.component }} is unavailable. Last good block: {{ with query "robyn_indexer_last_good_block" }}{{ . | first | value }}{{ end }}.'
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#component-down"
      - alert: RobynIndexerLag
        expr: robyn_indexer_lag_blocks > 5 or robyn_assurance_drill{alert="RobynIndexerLag"} == 1
        for: 2m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: indexer,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Robyn indexer is more than five blocks behind"
          description: 'Lag is {{ $value }} blocks. Last good block: {{ with query "robyn_indexer_last_good_block" }}{{ . | first | value }}{{ end }}.'
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetHeadObservationStale
        expr: robyn_testnet_head_observation_age_seconds > 120
        for: 1m
        labels:
          {
            severity: critical,
            chain_id: "46630",
            component: indexer,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest chain-head observation is stale"
          description: "The latest persisted Robinhood Testnet head observation is {{ $value }} seconds old."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetProjectionLag
        expr: robyn_testnet_projection_lag_blocks > 100
        for: 2m
        labels:
          {
            severity: critical,
            chain_id: "46630",
            component: projector,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest launch projection is behind"
          description: "Robinhood Testnet projection lag is {{ $value }} blocks."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetPipelineDown
        expr: robyn_testnet_pipeline_up == 0
        for: 1m
        labels:
          {
            severity: critical,
            chain_id: "46630",
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest {{ $labels.component }} pipeline is unhealthy"
          description: "The {{ $labels.component }} heartbeat is missing, stale, or degraded."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetCheckpointStalled
        expr: changes(robyn_testnet_checkpoint_block{component="projector"}[2m]) == 0 and robyn_testnet_projection_lag_blocks > 8
        for: 1m
        labels:
          {
            severity: critical,
            chain_id: "46630",
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest {{ $labels.component }} checkpoint is stalled"
          description: "The durable checkpoint has not advanced while its pipeline is behind."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetPipelineCycleSlow
        expr: robyn_testnet_indexer_cycle_milliseconds > 15000
        for: 2m
        labels:
          {
            severity: warning,
            chain_id: "46630",
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest {{ $labels.component }} cycle is slow"
          description: "The last pipeline cycle required {{ $value }} milliseconds."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetRpcRetries
        expr: increase(robyn_testnet_rpc_retry_count[2m]) > 0
        for: 1m
        labels:
          {
            severity: warning,
            chain_id: "46630",
            component: indexer,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest public RPC required retries"
          description: "{{ $value }} degraded pipeline cycles were recorded in two minutes."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetLanRpcUnavailable
        expr: robyn_testnet_rpc_up{provider="lan"} == 0
        for: 1m
        labels:
          {
            severity: warning,
            chain_id: "46630",
            component: rpc-gateway,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest is using the paid testnet RPC fallback"
          description: "The LAN testnet RPC is unreachable, on the wrong chain, or outside the accepted head-lag boundary."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetPaidRpcUnavailable
        expr: robyn_testnet_rpc_up{provider="alchemy"} == 0
        for: 1m
        labels:
          {
            severity: critical,
            chain_id: "46630",
            component: rpc-gateway,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest paid testnet RPC fallback is unavailable"
          description: "The Alchemy comparison and failover endpoint failed its chain or head probe."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetLanRpcBehind
        expr: robyn_testnet_rpc_head_lag_blocks > 50
        for: 1m
        labels:
          {
            severity: warning,
            chain_id: "46630",
            component: rpc-gateway,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest LAN testnet RPC is behind"
          description: "The LAN node is {{ $value }} blocks behind the paid comparison endpoint."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetAlchemyIdleBudget
        expr: robyn_testnet_rpc_projected_daily_cu > 250000
        for: 15m
        labels:
          {
            severity: warning,
            chain_id: "46630",
            component: keeper,
            runbook: rpc-cost,
          }
        annotations:
          summary: "Sherwood Forest projected idle RPC usage exceeds budget"
          description: "Projected keeper usage is {{ $value }} compute units per day."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/testnet-operations.md#alchemy-compute-budget"
      - alert: RobynTestnetAlchemyMonthlyBudget
        expr: robyn_testnet_rpc_projected_monthly_cu > 30000000
        for: 15m
        labels:
          {
            severity: critical,
            chain_id: "46630",
            component: keeper,
            runbook: rpc-cost,
          }
        annotations:
          summary: "Sherwood Forest projected monthly RPC usage exceeds allowance"
          description: "Projected keeper usage is {{ $value }} compute units per month."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/testnet-operations.md#alchemy-compute-budget"
      - alert: RobynTestnetKeeperScanBacklog
        expr: robyn_testnet_keeper_pending_scans > 0
        for: 15m
        labels:
          {
            severity: critical,
            chain_id: "46630",
            component: keeper,
            runbook: conversion-failure,
          }
        annotations:
          summary: "Sherwood Forest canonical keeper requests are stale"
          description: "{{ $value }} token scan requests have remained pending."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#conversion-failure"
      - alert: RobynTestnetWebSocketWakeDown
        expr: robyn_testnet_websocket_wake_up == 0 and robyn_testnet_pipeline_up{component="indexer"} == 0
        for: 2m
        labels:
          {
            severity: warning,
            chain_id: "46630",
            component: indexer,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest WebSocket wake and canonical ingestion are unhealthy"
          description: "The filtered wake channel is unavailable and HTTP reconciliation is not healthy."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynTestnetProtocolAuditStale
        expr: robyn_testnet_protocol_audit_up == 0
        for: 30m
        labels:
          {
            severity: critical,
            chain_id: "46630",
            component: api,
            runbook: accounting-drift,
          }
        annotations:
          summary: "Sherwood Forest protocol audit is stale or degraded"
          description: "The persisted 15-minute protocol audit is not healthy."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#accounting-drift"
      - alert: RobynMainnetLanRpcUnavailable
        expr: robyn_mainnet_rpc_gateway_configured == 1 and robyn_mainnet_rpc_up{provider="lan"} == 0
        for: 1m
        labels:
          {
            severity: warning,
            chain_id: "4663",
            component: rpc-gateway,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest Mainnet gateway is using Alchemy fallback"
          description: "The LAN Mainnet RPC is unreachable, on the wrong chain, or outside the accepted head-lag boundary."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynMainnetPaidRpcUnavailable
        expr: robyn_mainnet_rpc_gateway_configured == 1 and robyn_mainnet_rpc_up{provider="alchemy"} == 0
        for: 1m
        labels:
          {
            severity: critical,
            chain_id: "4663",
            component: rpc-gateway,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest paid Mainnet RPC fallback is unavailable"
          description: "The Alchemy comparison and failover endpoint failed its chain or head probe."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynMainnetLanRpcBehind
        expr: robyn_mainnet_rpc_gateway_configured == 1 and robyn_mainnet_rpc_head_lag_blocks > 50
        for: 1m
        labels:
          {
            severity: warning,
            chain_id: "4663",
            component: rpc-gateway,
            launch: all,
            asset: all,
            runbook: indexer-lag,
          }
        annotations:
          summary: "Sherwood Forest LAN Mainnet RPC is behind"
          description: "The LAN node is {{ $value }} blocks behind the paid comparison endpoint."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#indexer-lag"
      - alert: RobynRpcDivergence
        expr: robyn_rpc_divergence_blocks > 2 or robyn_assurance_drill{alert="RobynRpcDivergence"} == 1
        for: 1m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: rpc,
            launch: all,
            asset: all,
            runbook: rpc-divergence,
          }
        annotations:
          summary: "Operator and user RPC heads diverge"
          description: 'Divergence is {{ $value }} blocks. Last good block: {{ with query "robyn_indexer_last_good_block" }}{{ . | first | value }}{{ end }}.'
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#rpc-divergence"
      - alert: RobynDeadLetterOrFailedJob
        # BullMQ's failed set also contains protocol conversions waiting for the
        # scanner's bounded safe retry. Durable dead_letter state is the
        # authoritative terminal-failure signal; retrying work is covered by
        # RobynConversionStale if it cannot make progress.
        expr: robyn_job_audit_entries{state="dead_letter"} > 0 or robyn_assurance_drill{alert="RobynDeadLetterOrFailedJob"} == 1
        for: 0m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: keeper,
            launch: all,
            asset: all,
            runbook: conversion-failure,
          }
        annotations:
          summary: "Robyn conversion job needs operator action"
          description: 'A failed/dead-letter job exists. Last good block: {{ with query "robyn_indexer_last_good_block" }}{{ . | first | value }}{{ end }}.'
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#conversion-failure"
      - alert: RobynBackupStale
        expr: time() - robyn_backup_last_success_timestamp_seconds > 108000 or robyn_assurance_drill{alert="RobynBackupStale"} == 1
        for: 5m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: backup,
            launch: all,
            asset: all,
            runbook: backup-stale,
          }
        annotations:
          summary: "Robyn encrypted backup is older than 30 hours"
          description: 'No current backup is visible. Last good block: {{ with query "robyn_indexer_last_good_block" }}{{ . | first | value }}{{ end }}.'
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#backup-stale"
      - alert: RobynMetricsCollectorStale
        expr: time() - robyn_monitoring_collected_timestamp_seconds > 120 or robyn_assurance_drill{alert="RobynMetricsCollectorStale"} == 1
        for: 2m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: monitoring,
            launch: all,
            asset: all,
            runbook: monitoring-stale,
          }
        annotations:
          summary: "Robyn custom metrics are stale"
          description: 'Collector is stale. Last good block: {{ with query "robyn_indexer_last_good_block" }}{{ . | first | value }}{{ end }}.'
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#monitoring-stale"
      - alert: RobynDiskUtilization60
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!=""} / node_filesystem_size_bytes{mountpoint="/",fstype!=""} < 0.40
        for: 10m
        labels: { severity: warning, component: vm-disk, runbook: capacity }
        annotations:
          summary: "Sherwood VM disk utilization exceeded 60 percent"
          description: "Review scoped index growth and disk runway before increasing traffic."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#capacity"
      - alert: RobynDiskUtilization75
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!=""} / node_filesystem_size_bytes{mountpoint="/",fstype!=""} < 0.25
        for: 5m
        labels: { severity: critical, component: vm-disk, runbook: capacity }
        annotations:
          summary: "Sherwood VM disk utilization exceeded 75 percent"
          description: "Stop optional evidence growth and prepare bounded capacity remediation."
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#capacity"
      - alert: RobynDiskHeadroomLow
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!=""} / node_filesystem_size_bytes{mountpoint="/",fstype!=""} < 0.15 or robyn_assurance_drill{alert="RobynDiskHeadroomLow"} == 1
        for: 5m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: vm-disk,
            launch: all,
            asset: all,
            runbook: capacity,
          }
        annotations:
          summary: "Sherwood VM disk utilization exceeded 85 percent; indexer backfills are disabled"
          description: 'Free ratio is {{ $value }}. Last good block: {{ with query "robyn_indexer_last_good_block" }}{{ . | first | value }}{{ end }}.'
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#capacity"
      - alert: RobynMemoryHeadroomLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10 or robyn_assurance_drill{alert="RobynMemoryHeadroomLow"} == 1
        for: 5m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: vm-memory,
            launch: all,
            asset: all,
            runbook: capacity,
          }
        annotations:
          summary: "Robyn VM has less than 10 percent available memory"
          description: 'Available ratio is {{ $value }}. Last good block: {{ with query "robyn_indexer_last_good_block" }}{{ . | first | value }}{{ end }}.'
          runbook_url: "https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#capacity"
      - alert: RobynMonitoringDrill
        expr: robyn_alert_drill == 1
        for: 0m
        labels:
          {
            severity: warning,
            chain_id: 31337,
            component: monitoring,
            launch: all,
            asset: all,
            runbook: monitoring-stale,
          }
        annotations:
          summary: Robyn reversible monitoring drill is active
          description: 'This is an operator-initiated alert drill. Last good block: {{ with query "robyn_indexer_last_good_block" }}{{ . | first | value }}{{ end }}.'
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#monitoring-stale
      - alert: RobynKeeperStalled
        expr: time() - robyn_keeper_last_success_timestamp_seconds > 120 or robyn_assurance_drill{alert="RobynKeeperStalled"} == 1
        for: 2m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: keeper,
            launch: all,
            asset: all,
            runbook: conversion-failure,
          }
        annotations:
          summary: Robyn keeper progress is stale
          description: Keeper heartbeat has not advanced within the bounded interval.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#conversion-failure
      - alert: RobynConversionStale
        expr: robyn_oldest_pending_conversion_age_seconds > 300 or robyn_assurance_drill{alert="RobynConversionStale"} == 1
        for: 1m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: keeper,
            launch: all,
            asset: all,
            runbook: conversion-failure,
          }
        annotations:
          summary: A Robyn conversion has remained pending too long
          description: Oldest pending conversion age is {{ $value }} seconds.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#conversion-failure
      - alert: RobynAccountingDrift
        expr: robyn_accounting_drift > 0 or robyn_assurance_drill{alert="RobynAccountingDrift"} == 1
        for: 0m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: protocol,
            launch: all,
            asset: all,
            runbook: accounting-drift,
          }
        annotations:
          summary: Robyn accounting reconciliation failed
          description: The latest fail-closed protocol reconciliation reported drift.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#accounting-drift
      - alert: RobynServiceRestart
        expr: increase(robyn_pm2_process_restarts[5m]) > 0 or robyn_assurance_drill{alert="RobynServiceRestart"} == 1
        for: 0m
        labels:
          {
            severity: warning,
            chain_id: "31337",
            component: runtime,
            launch: all,
            asset: all,
            runbook: component-down,
          }
        annotations:
          summary: A Robyn PM2 process restarted
          description: Restart counters changed during the last five minutes.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#component-down
      - alert: RobynRestoreFailure
        expr: robyn_restore_last_result == 0 or robyn_assurance_drill{alert="RobynRestoreFailure"} == 1
        for: 0m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: backup,
            launch: all,
            asset: all,
            runbook: backup-stale,
          }
        annotations:
          summary: Robyn isolated restore rehearsal failed
          description: The most recent recorded restore result is unsuccessful.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/incident-response.md#backup-stale
      - alert: RobynSoakFailure
        expr: robyn_soak_last_result == 0 or robyn_assurance_drill{alert="RobynSoakFailure"} == 1
        for: 0m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: release,
            launch: all,
            asset: all,
            runbook: release-soak,
          }
        annotations:
          summary: Robyn release soak failed
          description: The latest recorded one-shot soak result is unsuccessful.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/release-operations.md#run-the-exact-release-soak
      - alert: RobynIpfsPinFailure
        expr: robyn_ipfs_pins{state="failed"} > 0 or robyn_ipfs_stale_objects > 0
        for: 5m
        labels:
          {
            severity: critical,
            chain_id: "31337",
            component: ipfs,
            launch: all,
            asset: metadata,
            runbook: ipfs-pinning,
          }
        annotations:
          summary: Robyn IPFS durability is degraded
          description: A local or remote pin failed or remained incomplete past its bounded interval.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/ipfs-token-metadata.md
      - alert: RobynIpfsPreparationStale
        expr: robyn_ipfs_stale_preparations > 0
        for: 15m
        labels:
          {
            severity: warning,
            chain_id: "31337",
            component: ipfs,
            launch: all,
            asset: metadata,
            runbook: ipfs-pinning,
          }
        annotations:
          summary: Prepared Robyn token metadata remains unbound
          description: At least one prepared metadata document remained unbound for more than 24 hours.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/ipfs-token-metadata.md

  - name: robinhood-rpc-node
    interval: 15s
    rules:
      - alert: RobinhoodRpcHostDown
        expr: up{job="robinhood-rpc-host"} == 0
        for: 2m
        labels:
          severity: critical
          chain_id: "4663"
          component: robinhood-rpc-host
          launch: all
          asset: all
          runbook: robinhood-rpc-node
        annotations:
          summary: Robinhood RPC node host metrics are unavailable
          description: The LAN-only chain-4663 node host cannot be scraped from the Robyn VM.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/robinhood-rpc-node.md
      - alert: RobinhoodNitroDown
        expr: up{job="robinhood-mainnet-nitro"} == 0
        for: 2m
        labels:
          severity: critical
          chain_id: "4663"
          component: robinhood-mainnet-nitro
          launch: all
          asset: all
          runbook: robinhood-rpc-node
        annotations:
          summary: Robinhood Mainnet Nitro metrics are unavailable
          description: The LAN-only Nitro node is down, bootstrapping, or unreachable from the Robyn VM.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/robinhood-rpc-node.md
      - alert: RobinhoodRpcDiskHeadroomLow
        expr: |
          node_filesystem_avail_bytes{job="robinhood-rpc-host",mountpoint="/",fstype!=""} < 100000000000
          or
          node_filesystem_avail_bytes{job="robinhood-rpc-host",mountpoint="/",fstype!=""}
            / node_filesystem_size_bytes{job="robinhood-rpc-host",mountpoint="/",fstype!=""} < 0.20
        for: 5m
        labels:
          severity: critical
          chain_id: "4663"
          component: robinhood-rpc-disk
          launch: all
          asset: all
          runbook: robinhood-rpc-node
        annotations:
          summary: Robinhood RPC node crossed its disk safety floor
          description: Available disk is below 100 GB or 20 percent, so snapshot recovery and continued chain growth lack the required margin.
          runbook_url: https://github.com/fourtytwo42/Robyn/blob/main/docs/robinhood-rpc-node.md
      - alert: RobinhoodRpcMemoryHeadroomLow
        expr: node_memory_MemAvailable_bytes{job="robinhood-rpc-host"} / node_memory_MemTotal_bytes{job="robinhood-rpc-host"} < 0.10
        for: 5m
        labels:
          severity: critical
          chain_id: "4663"
          component: robinhood-rpc-memory
          launch: all
          asset: all
          runbook: robinhood-rpc-node
        annotations:
          summary: Robinhood RPC node has less than 10 percent memory available
          description: Nitro is operating below the minimum memory safety floor.
