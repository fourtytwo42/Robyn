global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: robyn-devnet
    chain_id: "31337"
rule_files:
  - /etc/prometheus/robyn-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          component: prometheus
  - job_name: robyn-vm
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          component: vm
  - job_name: robinhood-rpc-host
    static_configs:
      - targets: ["192.168.50.117:9100"]
        labels:
          component: robinhood-rpc-host
          environment: robinhood-testnet
          chain_id: "46630"
  - job_name: robinhood-testnet-nitro
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.50.117:16071"]
        labels:
          component: robinhood-testnet-nitro
          environment: robinhood-testnet
          chain_id: "46630"
          rpc_endpoint: "192.168.50.117:8547"
