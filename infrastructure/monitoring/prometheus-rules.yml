      - alert: RobinhoodMainnetSwapHigh
        expr: node_memory_SwapTotal_bytes{job="robinhood-rpc-host"} - node_memory_SwapFree_bytes{job="robinhood-rpc-host"} > 2147483648
        for: 5m
        labels:
          severity: critical
          chain_id: "4663"
          component: robinhood-rpc-memory
          runbook: robinhood-rpc-node
        annotations:
