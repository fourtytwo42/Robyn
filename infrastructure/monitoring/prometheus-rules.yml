      - alert: RobinhoodMainnetL1ExecutionDown
        expr: robinhood_mainnet_l1_execution_up == 0
        for: 2m
        labels:
          severity: critical
          chain_id: "4663"
          component: robinhood-mainnet-l1
          runbook: robinhood-rpc-node
        annotations:
